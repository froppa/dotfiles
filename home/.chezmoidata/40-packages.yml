---
packages:
  brews:
    - coreutils
    - findutils
    - gnu-sed
    - grep
    - moreutils
    - tree
    - gcc
    - make
    - ripgrep

    # Shell & terminal
    - zsh
    - starship
    - tmux
    - fzf
    - z
    - direnv
    - ncdu

    # Networking & security
    - gnupg
    - openssh
    - openssl
    - nmap

    # CLI tools
    - age
    - bat
    - fd
    - jq
    - yq
    - htop
    - gh
    - git
    - git-lfs
    - lazygit
    - pipx
    - eza
    - httpie

    # Programming (language runtimes live in ~/.config/mise/config.toml)
    - mise
    - vim

    # Build tools
    - cmake
    - m4
    - autoconf
    - automake
    - libtool
    - boost
    - pkgconf
    # rustc wrapper; see ~/.cargo/config.toml
    - sccache

    # DevOps & container tools
    # terraform was removed from homebrew-core (BSL license); use opentofu,
    # or add `tap "hashicorp/tap"` + hashicorp/tap/terraform if genuinely needed
    - docker
    - chezmoi
    - shellcheck

  # Ubuntu package names are explicit: Brew formula names are not portable.
  # Vendor tools and language runtimes are documented separately in README.md.
  ubuntu:
    apt:
      - ca-certificates
      - curl
      - unzip
      - coreutils
      - findutils
      - sed
      - grep
      - moreutils
      - tree
      - build-essential
      - ripgrep
      - zsh
      - starship
      - tmux
      - fzf
      - direnv
      - ncdu
      - gnupg
      - openssh-client
      - openssl
      - nmap
      - age
      - bat
      - fd-find
      - jq
      - htop
      - gh
      - git
      - git-lfs
      - pipx
      - eza
      - httpie
      - vim
      - neovim
      - cmake
      - m4
      - autoconf
      - automake
      - libtool
      - libboost-dev
      - pkgconf
      - sccache
      - shellcheck

  casks:
    - ghostty
    - raycast
    - font-hack-nerd-font
    - font-meslo-lg-nerd-font
    - hammerspoon
    - scroll-reverser

  darwin:
    brews:
      - pinentry-mac
      - dockutil
      - xcode-build-server

  personal:
    brews:
      - opentofu
    casks:
      - discord

  work:
    brews:
      - awscli
    casks:
      - meetingbar
