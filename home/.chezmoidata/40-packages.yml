---
packages:
  brews:
    - coreutils
    - findutils
    - gnu-sed
    - grep
    - moreutils
    - gcc
    - make
    - ripgrep

    # Shell & terminal
    - zsh
    - starship
    - tmux
    - fzf
    - fzf-tab
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - zoxide
    - direnv
    - ncdu
    - screen
    - pure

    # Networking & security
    - gnupg
    - openssh
    - nmap
    - sops
    - keychain

    # CLI tools
    - age
    - bat
    - fd
    - jq
    - yq
    - htop
    - gh
    - git
    - git-lfs
    - lazygit
    - pipx
    - eza
    - httpie
    - cloc
    - humanlog
    - rtk
    - worktrunk
    - uv
    - tree

    # Programming (language runtimes live in ~/.config/mise/config.toml)
    - mise
    - neovim
    - gopls
    - goimports
    - lua-language-server
    - eslint
    - yamllint
    # keg-only, but linked so psql is on PATH; brew bundle would unlink it otherwise
    - name: libpq
      link: true

    # Build tools
    - cmake
    - automake
    - libtool
    # rustc wrapper; see ~/.cargo/config.toml
    - sccache

    # DevOps & container tools
    # terraform was removed from homebrew-core (BSL license); use opentofu,
    # or add `tap "hashicorp/tap"` + hashicorp/tap/terraform if genuinely needed
    - docker
    - docker-buildx
    - colima
    - kubernetes-cli
    - k9s
    - ansible
    - ansible-lint
    - cloudflare-wrangler
    - openclaw/tap/gogcli
    - chezmoi
    - shellcheck

    # Documents & fonts
    - ghostscript
    - mupdf-tools
    - woff2

  # Ubuntu package names are explicit: Brew formula names are not portable.
  # Vendor tools and language runtimes are documented separately in README.md.
  ubuntu:
    apt:
      - ca-certificates
      - curl
      - unzip
      - coreutils
      - findutils
      - sed
      - grep
      - moreutils
      - tree
      - build-essential
      - ripgrep
      - zsh
      - starship
      - tmux
      # Source of the ghostty terminfo entry that
      # run_once_after_24-install-ghostty-terminfo.sh derives xterm-ghostty from.
      - ncurses-term
      - fzf
      # fzf-tab has no apt package; .chezmoiexternal.toml drops it in
      # ~/.local/share/zsh/plugins where .zshrc looks last.
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - zoxide
      - direnv
      - ncdu
      - gnupg
      - openssh-client
      - openssl
      - nmap
      - netcat-openbsd
      - age
      - bat
      - fd-find
      - jq
      - htop
      - gh
      - git
      - git-lfs
      - pipx
      - eza
      - httpie
      - vim
      - neovim
      - cmake
      - m4
      - autoconf
      - automake
      - libtool
      - libboost-dev
      - pkgconf
      - sccache
      - shellcheck

  casks:
    - ghostty
    - raycast
    - font-hack-nerd-font
    - font-meslo-lg-nerd-font
    - font-powerline-symbols
    - hammerspoon
    - scroll-reverser
    - dockdoor
    - 1password-cli
    - db-browser-for-sqlite

  darwin:
    brews:
      - pinentry-mac
      - dockutil
      - duti
      - xcode-build-server
      - xcodegen
      - cocoapods
      - age-plugin-se
      - libimobiledevice
      - herdr
      # Serial and embedded hardware
      # - minicom
      # - libftdi
      # - e2fsprogs

  personal:
    brews:
      - opentofu
    casks: []

  work:
    brews:
      - awscli
    casks:
      - meetingbar
