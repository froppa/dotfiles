# TPM manages the other ~/.tmux/plugins/* itself (prefix+I); only tpm is bootstrapped here
[".tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm.git"
refreshPeriod = "168h"
