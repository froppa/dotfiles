# Pinned to tags/SHAs: upstream changes only land after a deliberate bump here.

{{ if ne .chezmoi.os "darwin" -}}
# fzf-tab has no apt package; Homebrew provides it on macOS, so this path is
# the last one .zshrc's _source_plugin checks.
[".local/share/zsh/plugins/fzf-tab"]
type = "archive"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/v1.3.0.tar.gz"
exact = true
stripComponents = 1
{{ end -}}

# TPM manages the other ~/.config/tmux/plugins/* itself; only TPM is external.
[".config/tmux/plugins/tpm"]
type = "archive"
url = "https://github.com/tmux-plugins/tpm/archive/refs/tags/v3.1.0.tar.gz"
exact = true
stripComponents = 1
