# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -su terminal-features
set -s terminal-features[3] "xterm-ghostty:RGB"

# Mouse / clipboard
set -g mouse on
set -g set-clipboard on

# History
set -g history-limit 100000

# Ghostty Hyper bindings send the prefix and command in one write.
set -s assume-paste-time 0

# Vim copy mode
setw -g mode-keys vi

# Splits
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Windows
bind c new-window -c "#{pane_current_path}"

# Navigation
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Zoom
bind z resize-pane -Z

# Kill pane: Enter confirms; Escape or any other key cancels.
bind x confirm-before -y -p "kill-pane #P?" kill-pane

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Status
set -g status-style 'bg=#1c1c1c,fg=#bcbcbc'
set -g status-left ''
set -g window-status-format '#[fg=#767676] #I '
set -g window-status-current-format '#[bg=#303030,fg=#87afff,bold] #I #[default]'
set -g window-status-separator ''
set -g status-right-length 120
set -g status-right '#[fg=#bcbcbc]#{b:pane_current_path}  #(~/.config/tmux/scripts/status-git.sh "#{pane_current_path}")#[fg=#5f87d7]│  #[fg=#bcbcbc]#(~/.config/tmux/scripts/status-memory.sh)  #[fg=#5f87d7]│  #[fg=#d0d0d0]%H:%M '
setw -g automatic-rename on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins/
if-shell 'test -x ~/.config/tmux/plugins/tpm/tpm' 'run ~/.config/tmux/plugins/tpm/tpm'
