# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -su terminal-features
set -s terminal-features[3] "xterm-ghostty:RGB:extkeys:hyperlinks"
set -s extended-keys on
set -g focus-events on
# Claude Code's tmux guidance: pass application escape sequences through.
set -g allow-passthrough on
# Ghostty's terminfo resets the cursor to a steady block; make the default a bar.
set -g cursor-style blinking-bar
set -g set-titles on
set -g set-titles-string '#W · #{pane_current_command}'

# Mouse / clipboard
set -g mouse on
set -g set-clipboard on

# Drag, double- and triple-click copy to the clipboard, drop the highlight, and
# stay in copy mode at the same scroll position instead of snapping to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-word ; send -X copy-selection'
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-line ; send -X copy-selection'
# No mouse pasting or Ctrl-click pane swapping; Cmd+V pastes the clipboard.
unbind -n MouseDown2Pane
unbind -n C-MouseDown1Pane
unbind -n C-MouseDown1Status

# History
set -g history-limit 100000

# Ghostty Hyper bindings send the prefix and command in one write.
set -g assume-paste-time 0

# Vim copy mode, styled to feel like Ghostty's own scrollback: no position
# box in the corner, selection and search matches in Ghostty's colours, and
# the bottom of the history leaves copy mode.
setw -g mode-keys vi
set -g copy-mode-position-format ''
set -g mode-style 'bg=#b5d5ff,fg=#000000'
set -g copy-mode-match-style 'bg=#303030,fg=#ffffff'
set -g copy-mode-current-match-style 'bg=#b5d5ff,fg=#000000'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Splits
unbind %
unbind '"'
bind -N "Split side by side" | split-window -h -c "#{pane_current_path}"
bind -N "Split stacked" - split-window -v -c "#{pane_current_path}"

# Windows
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},ssh,#{b:pane_current_path}}'
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -N "Rename window" , command-prompt -I "#W" { rename-window "%%" }
bind -N "Last window" Tab last-window
bind -N "Pick a window" w choose-tree -Zw
bind -N "Move window left" -r < swap-window -d -t -1
bind -N "Move window right" -r > swap-window -d -t +1

# Panes
bind -N "Break pane into its own window" ! break-pane
bind -N "Join a pane from another window" j choose-tree -Zw { join-pane -s "%%" }
bind -N "Move this pane into another window" m choose-tree -Zw { join-pane -t "%%" }
bind -N "Resize left" -r S-Left resize-pane -L 5
bind -N "Resize down" -r S-Down resize-pane -D 3
bind -N "Resize up" -r S-Up resize-pane -U 3
bind -N "Resize right" -r S-Right resize-pane -R 5

# Navigation
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Zoom
bind z resize-pane -Z

# Kill pane: Enter confirms; Escape or any other key cancels.
bind x confirm-before -y -p "kill-pane #P?" kill-pane

# Links and help
# display-popup does not expand formats; run-shell does, and -b keeps the
# server from waiting on the popup.
bind -N "Open a URL from the pane history" u run-shell -b "tmux display-popup -E -w 80% -h 50% '~/.config/tmux/scripts/urls.sh #{pane_id}'"
bind -N "Cheat sheet" h display-popup -E -w 84 -h 40 "~/.config/tmux/scripts/cheatsheet.sh | less -R"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Status: two rows at the bottom. Row 0 = where the active pane runs plus
# window tabs, row 1 = agents, remaining limits, git, RAM. status-context.sh
# publishes the colours of the host in focus; styles read them because they
# cannot run commands themselves. Flip both rows to the top with
# "set -g status-position top".
set -g @ctx_color '#5f87d7'
set -g @ctx_tint '#1c1c1c'
set -g status 2
set -g status-position bottom
set -g status-interval 3
set -g status-style 'bg=#{@ctx_tint},fg=#bcbcbc'
set -g pane-active-border-style 'fg=#{@ctx_color}'
set -g pane-border-style 'fg=#303030'
set -g status-left-length 40
set -g status-left '#(~/.config/tmux/scripts/status-context.sh #{pane_pid} #{q:pane_current_command} badge) '
# The tab script ends with #[default], which also drops the tab background, so
# the padding after it restores the style. A split window shows | (side by
# side), - (stacked) or |- (both) from its layout string; Z marks a zoomed one.
set -g window-status-format '#[fg=#767676] #I #(~/.config/tmux/scripts/status-context.sh #{pane_pid} #{q:pane_current_command} tab #{q:window_name} #{@agent_state})#[fg=#767676]#{?#{>:#{window_panes},1}, #{?#{m:*{*,#{window_layout}},|,}#{?#{m:*\[*,#{window_layout}},-,},}#{?window_zoomed_flag, Z,} '
set -g window-status-current-format '#[bg=#303030,fg=#87afff,bold] #I #(~/.config/tmux/scripts/status-context.sh #{pane_pid} #{q:pane_current_command} tab #{q:window_name} #{@agent_state})#[bg=#303030,fg=#767676]#{?#{>:#{window_panes},1}, #{?#{m:*{*,#{window_layout}},|,}#{?#{m:*\[*,#{window_layout}},-,},}#{?window_zoomed_flag, Z,} #[default]'
set -g window-status-separator ''
set -g status-right-length 20
set -g status-right '#[fg=#d0d0d0]%H:%M '
set -g status-format[1] '#[fg=#585858] ⇪H keys#[align=right]#(~/.config/tmux/scripts/status-agents.sh)  #[fg=#5f87d7]│  #(~/.config/tmux/scripts/status-usage.sh)  #(~/.config/tmux/scripts/status-git.sh "#{pane_current_path}")#[fg=#5f87d7]│  #[fg=#bcbcbc]#(~/.config/tmux/scripts/status-memory.sh) '

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins/
if-shell 'test -x ~/.config/tmux/plugins/tpm/tpm' 'run ~/.config/tmux/plugins/tpm/tpm'
