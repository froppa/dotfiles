# ~/.config/starship.toml
# Managed by chezmoi
#
# Compact left prompt with contextual details on the right.

add_newline = false

format = '$directory$git_branch$git_status$git_state$direnv$jobs$character '
right_format = '($username$hostname )$cmd_duration$status'

palette = 'froppa'

# ── Palette ───────────────────────────────────────────────────

[palettes.froppa]
blue = '#5f87d7'
light = '#87afff'
purple = '#d75fd7'
yellow = '#d7af5f'
green = '#5faf5f'
red = '#d75f5f'
grey = '#767676'

# ── Prompt ────────────────────────────────────────────────────

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'
format = ' $symbol'

# ── Directory ─────────────────────────────────────────────────

[directory]
style = 'bold blue'
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style)'
read_only = ' ro'
read_only_style = 'red'

# ── Git ───────────────────────────────────────────────────────

[git_branch]
style = 'bold purple'
format = '[($branch)]($style)'

[git_status]
style = 'bold yellow'
format = '([$all_status$ahead_behind]($style))'

conflicted = '⚔'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
untracked = '?'
stashed = 's'
modified = '*'
staged = '+'
renamed = 'M'
deleted = 'X'

[git_state]
style = 'yellow'
format = ' [$state( $progress_current/$progress_total)]($style)'

# ── Environment ───────────────────────────────────────────────

[direnv]
disabled = false
style = 'grey'
format = ' [$allowed]($style)'

allowed_msg = 'env'
not_allowed_msg = 'env!'
denied_msg = 'env✗'

# ── Jobs ──────────────────────────────────────────────────────

[jobs]
style = 'yellow'
symbol = '⚙'
number_threshold = 1
format = ' [$symbol$number]($style)'

# ── Runtime modules ───────────────────────────────────────────
#
# Available if later added to `format`.
# Intentionally hidden from the default prompt.

[python]
style = 'grey'
symbol = 'py '
format = ' [$symbol$version( $virtualenv)]($style)'

# ── Command result ────────────────────────────────────────────

[cmd_duration]
min_time = 2000
style = 'grey'
format = '[$duration]($style) '

[status]
disabled = false
style = 'red'
format = '[$status]($style) '

# ── Remote identity ───────────────────────────────────────────
#
# The conditional group in `right_format` means spacing appears only when
# username/hostname actually render.

[username]
style_user = 'green'
style_root = 'red'
show_always = false
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'bold green'
format = '[@$hostname]($style)'
